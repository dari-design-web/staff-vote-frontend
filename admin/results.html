<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>票數統計 — 員工投票系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans TC',sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<header class="bg-white border-b border-slate-200">
  <div class="max-w-5xl mx-auto px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h1 class="font-bold text-slate-800">員工投票管理</h1>
      <nav class="flex gap-3 text-sm">
        <a href="staff.html" class="text-slate-600 hover:text-emerald-700">員工管理</a>
        <a href="results.html" class="text-emerald-700 font-bold border-b-2 border-emerald-500 pb-3">票數統計</a>
      </nav>
    </div>
    <button onclick="adminLogout()" class="text-sm text-slate-500 hover:text-red-600">登出</button>
  </div>
</header>

<main class="max-w-5xl mx-auto px-5 py-6">
  <div class="flex flex-wrap items-end gap-3 mb-5">
    <div>
      <label class="text-xs text-slate-500 block mb-1">月份</label>
      <select id="month" class="border border-slate-300 rounded px-3 py-2 text-sm min-w-[140px]"></select>
    </div>
    <button onclick="load()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded">查詢</button>
    <button onclick="downloadExcel()" class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm px-4 py-2 rounded">下載 Excel</button>
    <div class="grow"></div>
    <div id="totalBadge" class="text-sm text-slate-500"></div>
  </div>

  <div id="loading" class="text-center py-12 text-slate-400 text-sm">載入中…</div>

  <section id="ticketSec" class="hidden mb-6">
    <h3 class="text-base font-bold mb-2">
      <span class="inline-block w-2 h-4 bg-emerald-500 rounded mr-1 align-middle"></span>
      現場票務組
    </h3>
    <table class="w-full bg-white border border-slate-200 rounded-lg overflow-hidden text-sm">
      <thead class="bg-slate-50 text-slate-600 text-left">
        <tr>
          <th class="px-3 py-2 w-12">名次</th>
          <th class="px-3 py-2 w-16">照片</th>
          <th class="px-3 py-2">姓名</th>
          <th class="px-3 py-2 w-24 text-right">票數</th>
          <th class="px-3 py-2 w-24">百分比</th>
        </tr>
      </thead>
      <tbody id="ticketRows"></tbody>
    </table>
  </section>

  <section id="fieldSec" class="hidden">
    <h3 class="text-base font-bold mb-2">
      <span class="inline-block w-2 h-4 bg-cyan-500 rounded mr-1 align-middle"></span>
      外場服務組
    </h3>
    <table class="w-full bg-white border border-slate-200 rounded-lg overflow-hidden text-sm">
      <thead class="bg-slate-50 text-slate-600 text-left">
        <tr>
          <th class="px-3 py-2 w-12">名次</th>
          <th class="px-3 py-2 w-16">照片</th>
          <th class="px-3 py-2">姓名</th>
          <th class="px-3 py-2 w-24 text-right">票數</th>
          <th class="px-3 py-2 w-24">百分比</th>
        </tr>
      </thead>
      <tbody id="fieldRows"></tbody>
    </table>
  </section>
</main>

<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl z-50 text-sm"></div>

<script>
if (!requireAdmin()) {}

function toast(msg, ms=2200){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'), ms);
}

function currentMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function rowHTML(r, total, rank) {
  const pct = total > 0 ? (r.vote_count / total * 100).toFixed(1) : '0.0';
  const photo = r.id ? `<img src="${staffPhotoURL(r.id)}?t=${Date.now()}" class="w-10 h-10 object-cover rounded-full" onerror="this.style.display='none'">` : '';
  const off = r.active ? '' : '<span class="ml-1 text-[10px] bg-slate-200 text-slate-600 px-1 rounded">下架</span>';
  return `<tr class="border-t border-slate-100 ${rank===1?'bg-amber-50':''}">
    <td class="px-3 py-2 font-bold ${rank===1?'text-amber-600 text-lg':''}">${rank}</td>
    <td class="px-3 py-2">${photo}</td>
    <td class="px-3 py-2">${esc(r.name)}${off}</td>
    <td class="px-3 py-2 text-right font-bold">${r.vote_count}</td>
    <td class="px-3 py-2"><div class="text-xs text-slate-500">${pct}%</div>
      <div class="h-1.5 bg-slate-200 rounded mt-1 overflow-hidden">
        <div class="h-full bg-emerald-500" style="width:${pct}%"></div>
      </div>
    </td>
  </tr>`;
}

async function loadMonths() {
  try {
    const data = await API.get('/api/admin/results?month=' + currentMonth(), true);
    const sel = document.getElementById('month');
    const months = (data.available_months||[]).map(m => m.vote_month);
    const cm = currentMonth();
    if (!months.includes(cm)) months.unshift(cm);
    sel.innerHTML = '<option value="">本月 (' + cm + ')</option>' +
      months.map(m => `<option value="${m}">${m}</option>`).join('') +
      '<option value="all">全部累計</option>';
  } catch (e) {
    if (e.status === 401) { adminLogout(); return; }
  }
}

async function load() {
  const month = document.getElementById('month').value;
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('ticketSec').classList.add('hidden');
  document.getElementById('fieldSec').classList.add('hidden');
  try {
    const url = '/api/admin/results' + (month ? ('?month=' + encodeURIComponent(month)) : '');
    const data = await API.get(url, true);
    const rows = data.results || [];
    const ticket = rows.filter(r => r.category === 'ticket');
    const field  = rows.filter(r => r.category === 'field');
    const total = rows.reduce((a,b)=>a+b.vote_count, 0);
    document.getElementById('totalBadge').textContent =
      `${data.month === 'all' ? '全部累計' : data.month} 總票數 ${total}`;

    const tTotal = ticket.reduce((a,b)=>a+b.vote_count, 0);
    const fTotal = field.reduce((a,b)=>a+b.vote_count, 0);
    document.getElementById('ticketRows').innerHTML =
      ticket.length ? ticket.map((r,i)=>rowHTML(r, tTotal, i+1)).join('')
                    : '<tr><td colspan="5" class="text-center text-slate-400 py-6">本月票務組無投票</td></tr>';
    document.getElementById('fieldRows').innerHTML =
      field.length ? field.map((r,i)=>rowHTML(r, fTotal, i+1)).join('')
                   : '<tr><td colspan="5" class="text-center text-slate-400 py-6">本月外場組無投票</td></tr>';

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('ticketSec').classList.remove('hidden');
    document.getElementById('fieldSec').classList.remove('hidden');
  } catch (e) {
    if (e.status === 401) { adminLogout(); return; }
    document.getElementById('loading').innerHTML =
      '<p class="text-red-500">載入失敗:' + esc(e.message) + '</p>';
  }
}

function downloadExcel() {
  const month = document.getElementById('month').value;
  const token = localStorage.getItem(LS_ADMIN_TOKEN);
  // 用 fetch 帶 header 然後 blob 下載
  const url = API_BASE + '/api/admin/export' + (month ? '?month=' + encodeURIComponent(month) : '');
  fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const disp = r.headers.get('Content-Disposition') || '';
      const m = disp.match(/filename\*=UTF-8''([^;]+)/);
      const fname = m ? decodeURIComponent(m[1]) : 'votes.xlsx';
      return r.blob().then(b => ({b, fname}));
    })
    .then(({b, fname}) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = fname;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    })
    .catch(e => toast('下載失敗:' + e.message));
}

(async () => {
  await loadMonths();
  await load();
})();
</script>
</body>
</html>
