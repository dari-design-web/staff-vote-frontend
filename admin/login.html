<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台登入 — 員工投票系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans TC',sans-serif}</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-sm">
  <div class="bg-white rounded-2xl shadow-lg p-8">
    <h1 class="text-xl font-bold text-slate-800 mb-1">員工投票管理</h1>
    <p class="text-sm text-slate-500 mb-6">請以管理員身份登入</p>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="text-sm text-slate-600 block mb-1">Email</label>
        <input id="email" type="email" required autocomplete="username"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div>
        <label class="text-sm text-slate-600 block mb-1">密碼</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div id="err" class="hidden text-sm text-red-600"></div>
      <button type="submit" id="submitBtn"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
        登入
      </button>
    </form>
  </div>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('err');
  err.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = '登入中…';
  try {
    const r = await API.post('/api/admin/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    localStorage.setItem(LS_ADMIN_TOKEN, r.token);
    location.href = 'staff.html';
  } catch (e) {
    err.textContent = '登入失敗:' + e.message;
    err.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = '登入';
  }
});
</script>
</body>
</html>
